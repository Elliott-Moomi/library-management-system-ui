version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.0

jobs:
  install:
    executor: node-executor
    steps:
      - checkout

      - restore_cache:
          keys:
            - yarn-v1-{{ checksum "yarn.lock" }}
            - yarn-v1-

      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile

      - save_cache:
          key: yarn-v1-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    executor: node-executor
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Run ESLint
          command: yarn lint

      - run:
          name: Run Prettier check
          command: yarn format:check

  test:
    executor: node-executor
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Run tests
          command: yarn test

  build:
    executor: node-executor
    steps:
      - attach_workspace:
          at: .

      - run:
          name: Build React app
          command: yarn build

workflows:
  version: 2
  build_and_test:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - lint
            - test
